name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Owaiz20Ahamed
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C084FC&color_dots=%23F3F4F6,%23BBF7D0,%2386EFAC,%234ADE80,%2316A34A

            dist/github-contribution-grid-snake-dark.svg?color_snake=%23D8B4FE&color_dots=%23343A46,%230E4429,%2326A641,%2339D353,%237EE787

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
